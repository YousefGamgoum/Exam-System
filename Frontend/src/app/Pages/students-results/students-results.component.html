
<div class="exams-container">
    <div *ngIf="loading" class="loading">
        Loading exam results...
    </div>

    <div *ngIf="error" class="error">
        {{ error }}
    </div>

    <div *ngIf="!loading && !error" class="exam-cards">
        <div *ngFor="let result of examResults" class="exam-card">
            <div class="card-header text-center">
                <h3>{{ result.exam.name }}</h3>
            </div>
            <div class="card-body">
                <div class="info-row">
                    <span class="label">Student:</span>
                    <span class="value">{{ result.user.name }}</span>
                </div>
                <div class="info-row">
                    <span class="label">Score:</span>
                    <span class="value">{{ result.score }}/{{ result.exam.totalMarks }}</span>
                </div>
                <div class="info-row">
                    <span class="label">Questions:</span>
                    <span class="value">{{ result.exam.questionCount }}</span>
                </div>

            </div>
        </div>
    </div>
</div>
